# PrepFlow — bloc Nginx inclus dans la configuration de FilaFlow
# Installé dans /etc/nginx/snippets/prepflow.conf par scripts/install.sh
# et appelé par « include snippets/prepflow.conf; » dans le server HTTPS.

location = /prepflow { return 301 /prepflow/; }

location /prepflow/ {
    # Le « / » final retire le préfixe : PrepFlow reçoit /api/..., /css/...
    proxy_pass         http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
