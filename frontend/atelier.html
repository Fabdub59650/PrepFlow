<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141517">
<title>Atelier — PrepFlow</title>
<script>
  // Dernier mode affiché, appliqué avant le rendu pour éviter un flash de thème
  try { if (localStorage.getItem('prepflow_scheme') === 'light') document.documentElement.setAttribute('data-color-scheme', 'light'); } catch (e) {}
</script>
<!-- Chemins relatifs : l'application est servie sous /prepflow/ -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/atelier.css">
<script type="module" src="js/atelier.js"></script>
</head>
<body class="atelier">
<header class="at-top">
  <span class="at-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">PrepFlow</span>
    <span class="at-mode">Atelier</span>
  </span>
  <span class="at-clock" id="at-clock" aria-label="Heure"></span>
  <span class="at-end">
    <span id="at-offline" class="at-offline" hidden>PrepFlow injoignable</span>
    <span id="filaflow-status" class="ff-status"><span class="status-dot" aria-hidden="true"></span><span class="status-label">Stock…</span></span>
    <button type="button" class="at-icon-btn" id="at-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </span>
</header>
<div class="at-banners" id="at-banners" hidden><button type="button" class="at-maint" id="at-maint" hidden></button><button type="button" class="at-maint at-weigh" id="at-weigh" hidden></button></div>
<main class="at-main">
  <section class="at-col at-col-running" aria-labelledby="at-h-running">
    <h2 class="at-h" id="at-h-running">En cours <span class="count-chip" id="at-running-count"></span></h2>
    <div class="at-scroll" id="at-running"></div>
  </section>
  <section class="at-col at-col-ready" aria-labelledby="at-h-ready">
    <div class="at-tabs" role="tablist" id="at-h-ready">
      <button type="button" class="at-tab on" role="tab" aria-selected="true" data-tab="lancer">À lancer</button>
      <button type="button" class="at-tab" role="tab" aria-selected="false" data-tab="controler">À contrôler <span class="count-chip" id="at-check-count"></span></button>
    </div>
    <button type="button" class="at-btn at-code-btn" id="at-code">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>
      Chercher par code
    </button>
    <div class="at-scroll" id="at-ready"></div>
  </section>
</main>
<div id="at-veille" class="at-veille" hidden></div>
</body>
</html>
