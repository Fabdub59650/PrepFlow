# PrepFlow — configuration du kiosque (Pi 3B+ avec écran tactile 7").
# Fichier lu par start-kiosk.sh et screen-watch.sh. Se modifie avec : nano ~/prepflow-kiosk/kiosk.conf
# (appliqué au prochain redémarrage du Pi 3 : sudo reboot)

# Page affichée en plein écran. « ?veille=SECONDES » règle la veille de la page (90 par défaut, 0 = jamais).
KIOSK_URL="https://filaflow.local/prepflow/atelier.html"

# Nuit : écran éteint (réveil au toucher), rallumé automatiquement le matin.
NIGHT_FROM=22        # heure de début (0-23)
NIGHT_TO=7           # heure de fin (0-23)
NIGHT_OFF_AFTER=120  # la nuit, extinction après N secondes sans toucher (après un réveil, l'écran se rééteint)

# Jour : extinction réelle de l'écran après N secondes sans toucher (0 = jamais éteint).
# Avant cela, la page passe déjà en « veille » (écran presque noir avec l'heure et l'avancement) après 90 s.
DAY_OFF_AFTER=1800
